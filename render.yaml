services:
  - type: web
    name: ai-broadcast-engineering-assistant
    runtime: python
    plan: free

    buildCommand: pip install -r backend/requirements.txt

    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-broadcast-engineering-db
          property: connectionString

databases:
  - name: ai-broadcast-engineering-db
    plan: free