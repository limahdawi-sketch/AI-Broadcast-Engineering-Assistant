<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSNG Troubleshooting Assistant / مساعد استكشاف أعطال DSNG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B1016;
    --panel: #131A23;
    --panel-2: #0F151D;
    --line: #223041;
    --text: #E7EEF5;
    --text-dim: #8FA1B3;
    --amber: #F0A63A;
    --cyan: #35C9C1;
    --red: #E5555B;
    --violet: #8B7FE8;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, #14202c 0%, transparent 55%),
      radial-gradient(ellipse at 100% 0%, #10161f 0%, transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:780px;margin:0 auto;}

  header{margin-bottom:22px;}
  .eyebrow-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .eyebrow-left{display:flex;align-items:center;gap:10px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);flex-shrink:0;}
  .station-id{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);letter-spacing:.02em;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .version-tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);border:1px solid var(--line);padding:3px 9px;border-radius:2px;}
  .lang-toggle{
    display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;font-family:'JetBrains Mono',monospace;font-size:11px;
  }
  .lang-toggle button{background:var(--panel);color:var(--text-dim);border:none;padding:5px 11px;cursor:pointer;font-family:inherit;font-size:inherit;}
  .lang-toggle button.active{background:var(--cyan);color:#06181a;font-weight:700;}
  h1{font-size:26px;font-weight:900;margin:0 0 6px;line-height:1.35;}
  .sub{color:var(--text-dim);font-size:14.5px;line-height:1.7;max-width:60ch;}

  .info-bar{
    margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  }
  @media (max-width:520px){.info-bar{grid-template-columns:1fr;}}
  .field label{display:block;font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin-bottom:5px;}
  .field input, .field select{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:2px;padding:8px 10px;font-family:'Tajawal',sans-serif;font-size:13.5px;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--cyan);}

  details.about{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);}
  details.about summary{
    cursor:pointer;padding:12px 16px;font-size:13.5px;font-weight:700;color:var(--text-dim);
    list-style:none;display:flex;align-items:center;gap:8px;
  }
  details.about summary::-webkit-details-marker{display:none;}
  details.about summary::before{content:'+';color:var(--cyan);font-family:'JetBrains Mono',monospace;font-size:15px;width:14px;}
  details.about[open] summary::before{content:'\2013';}
  .about-body{padding:0 16px 16px;font-size:13.5px;line-height:1.85;color:var(--text-dim);}
  .about-body h4{color:var(--text);font-size:13px;margin:14px 0 6px;font-family:'JetBrains Mono',monospace;font-weight:600;}
  .about-body p{margin:0 0 4px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 30px;}
  @media (max-width:520px){.grid{grid-template-columns:1fr;}}
  .card-btn{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 14px; text-align:right; cursor:pointer; color:var(--text);
    display:flex; flex-direction:column; gap:10px;
    transition:border-color .15s ease, transform .1s ease; font-family:inherit;
  }
  .card-btn:hover{border-color:var(--cyan);}
  .card-btn:active{transform:scale(.99);}
  .card-btn svg{width:22px;height:22px;stroke:var(--cyan);flex-shrink:0;}
  .card-btn .ct{font-size:15px;font-weight:700;}
  .card-btn .cd{font-size:12.5px;color:var(--text-dim);line-height:1.5;}

  .stats-line{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-dim);margin:-16px 0 26px;text-align:center;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 20px;display:none;}
  .panel.active{display:block;}
  .panel-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
  .cat-tag{font-size:12px;color:var(--cyan);font-family:'JetBrains Mono',monospace;}
  .icon-btn{
    background:transparent;border:1px solid var(--line);color:var(--text-dim);
    font-family:'Tajawal',sans-serif;font-size:12.5px;padding:6px 12px;border-radius:var(--radius);cursor:pointer;
  }
  .icon-btn:hover{color:var(--text);border-color:var(--text-dim);}
  .icon-btn:disabled{opacity:.35;cursor:default;}
  .icon-btn:disabled:hover{color:var(--text-dim);border-color:var(--line);}

  .trail{margin-bottom:18px;border-right:2px solid var(--line);padding-right:12px;display:flex;flex-direction:column;gap:10px;}
  html[dir="ltr"] .trail{border-right:none;border-left:2px solid var(--line);padding-right:0;padding-left:12px;}
  .trail-item{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--text-dim);line-height:1.6;}
  .trail-item b{color:var(--text);font-weight:500;}

  .q-text{font-size:17px;font-weight:700;line-height:1.6;margin:0 0 16px;}
  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text); text-align:right;
    padding:12px 14px; border-radius:var(--radius); font-family:inherit; font-size:14.5px; cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .opt-btn:hover{border-color:var(--cyan);background:#101822;}

  .result{border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;}
  .result-head{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);}
  .sev-tag{font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 8px;border-radius:2px;flex-shrink:0;}
  .sev-critical .sev-tag{background:rgba(229,85,91,.15);color:var(--red);}
  .sev-warning .sev-tag{background:rgba(240,166,58,.15);color:var(--amber);}
  .sev-info .sev-tag{background:rgba(53,201,193,.15);color:var(--cyan);}
  .result-title{font-size:16.5px;font-weight:700;}
  .result-body{padding:16px;background:var(--panel-2);}
  .result-body .label{font-size:11.5px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin-bottom:8px;}
  .result-body ul{margin:0 0 4px;padding-right:18px;}
  html[dir="ltr"] .result-body ul{padding-right:0;padding-left:18px;}
  .result-body li{font-size:14.5px;line-height:1.75;margin-bottom:6px;}

  .result-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .btn{border:1px solid var(--line);background:transparent;color:var(--text);font-family:'Tajawal',sans-serif;font-size:13px;padding:9px 16px;border-radius:var(--radius);cursor:pointer;}
  .btn:hover{border-color:var(--cyan);}
  .btn.primary{background:var(--cyan);color:#06181a;border-color:var(--cyan);font-weight:700;}
  .btn.primary:hover{opacity:.9;}
  .copy-flash{font-size:12px;color:var(--cyan);font-family:'JetBrains Mono',monospace;margin-inline-start:4px;display:none;}

  .ai-section{margin-top:30px;}
  .ai-toggle{width:100%;text-align:right;background:transparent;border:1px dashed var(--line);color:var(--text-dim);padding:14px 16px;border-radius:var(--radius);font-family:inherit;font-size:14px;cursor:pointer;}
  .ai-toggle:hover{border-color:var(--violet);color:var(--text);}
  .ai-box{display:none;margin-top:12px;}
  .ai-box.active{display:block;}
  textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:var(--radius);padding:12px 14px;font-family:'Tajawal',sans-serif;font-size:14.5px;min-height:90px;resize:vertical;}
  textarea:focus{outline:none;border-color:var(--violet);}
  .ai-submit{margin-top:10px;background:var(--violet);color:#0B1016;border:none;padding:10px 20px;border-radius:var(--radius);font-family:'Tajawal',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}
  .ai-submit:disabled{opacity:.5;cursor:default;}
  .ai-answer{margin-top:14px;border:1px dashed var(--violet);border-radius:var(--radius);padding:16px;background:var(--panel-2);display:none;}
  .ai-answer.active{display:block;}
  .ai-answer .label{font-size:11.5px;color:var(--violet);font-family:'JetBrains Mono',monospace;margin-bottom:10px;}
  .ai-answer .content{font-size:14.5px;line-height:1.8;white-space:pre-wrap;}
  .ai-loading{font-size:13.5px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .ai-note{font-size:11.5px;color:var(--text-dim);margin-top:10px;line-height:1.6;}

  .section-block{margin-top:34px;}
  .section-head h2{font-size:17px;margin:0 0 6px;}
  .section-sub{font-size:13px;color:var(--text-dim);line-height:1.7;margin:0 0 16px;}
  .note-inline{color:var(--cyan);}
  .form-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;}
  .status-msg{font-size:12.5px;color:var(--cyan);font-family:'JetBrains Mono',monospace;margin-inline-start:10px;}
  .list-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;flex-wrap:wrap;gap:8px;}
  .count-tag{font-size:12.5px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .empty-msg{font-size:13.5px;color:var(--text-dim);padding:14px 0;}
  .entry-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .entry-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .entry-title{font-size:15px;font-weight:700;}
  .entry-badge{font-family:'JetBrains Mono',monospace;font-size:10.5px;background:rgba(240,166,58,.15);color:var(--amber);padding:2px 8px;border-radius:2px;white-space:nowrap;}
  .entry-cat-tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan);margin-bottom:8px;}
  .entry-field-label{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin:10px 0 4px;}
  .entry-field-text{font-size:13.5px;line-height:1.75;white-space:pre-wrap;color:var(--text);}
  .entry-meta{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;margin-top:12px;}
  .entry-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .entry-actions .btn{font-size:12px;padding:7px 12px;}
  .entry-actions .btn.danger:hover{border-color:var(--red);color:var(--red);}
  .privacy-note{font-size:12px;color:var(--amber);background:rgba(240,166,58,.08);border:1px solid rgba(240,166,58,.3);border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;line-height:1.7;}

  footer{margin-top:40px;text-align:center;color:var(--text-dim);font-size:11.5px;font-family:'JetBrains Mono',monospace;}

  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block !important;position:absolute;top:0;right:0;left:0;width:100%;padding:20px;}
    body{background:#fff;color:#000;}
  }
  .pr-h{font-size:19px;font-weight:900;margin:0 0 4px;}
  .pr-sub{font-size:12px;color:#555;margin-bottom:18px;}
  .pr-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:13px;margin-bottom:16px;border:1px solid #ccc;padding:12px;border-radius:3px;}
  .pr-meta div span{color:#666;font-size:11px;display:block;}
  .pr-section-title{font-size:12px;font-weight:700;color:#333;border-bottom:1px solid #ccc;padding-bottom:4px;margin:16px 0 8px;}
  .pr-step{font-size:13px;margin-bottom:6px;line-height:1.6;}
  .pr-diag{border:1px solid #999;border-radius:3px;padding:12px;margin-top:8px;}
  .pr-diag h3{margin:0 0 8px;font-size:15px;}

  html[dir="ltr"] body{text-align:left;}
  html[dir="ltr"] .card-btn, html[dir="ltr"] .opt-btn, html[dir="ltr"] .field input,
  html[dir="ltr"] .field select, html[dir="ltr"] textarea{text-align:left;}

  /* ---------------- AI ASSISTANT - PREMIUM DARK UI ---------------- */

.ai-prepared{
  margin-top: 14px;
  padding: 18px;
  border: 1px solid #2A3A4C;
  border-radius: 14px;
  background: linear-gradient(180deg, #111A24 0%, #0D141D 100%);
  box-shadow: 0 10px 30px rgba(0,0,0,.22);
}

.ai-prepared p{
  margin: 0 0 12px;
}

.ai-prepared > p:first-child{
  color: #E7EEF5;
  font-size: 14px;
  font-weight: 700;
}

.ai-prompt-preview{
  width: 100%;
  min-height: 220px;
  box-sizing: border-box;
  resize: vertical;
  padding: 14px;
  border: 1px solid #2B3A49;
  border-radius: 10px;
  background: #0A1017;
  color: #DDE7F0;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  line-height: 1.7;
  outline: none;
}

.ai-prompt-preview:focus{
  border-color: #4C6A85;
}

.ai-actions{
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}

.ai-action-btn{
  appearance: none;
  border: 1px solid #314456;
  border-radius: 10px;
  padding: 10px 16px;
  background: #182330;
  color: #E7EEF5;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: .18s ease;
}

.ai-action-btn:hover{
  background: #213142;
  border-color: #4A647C;
  transform: translateY(-1px);
}

.ai-action-btn:active{
  transform: translateY(0);
}

#copyAiPrompt{
  background: #1C2A38;
}

#openChatGPT{
  background: #17251F;
  border-color: #345347;
}

#openClaude{
  background: #282019;
  border-color: #584638;
}

.ai-external-note{
  margin-top: 12px !important;
  color: #8FA1B3 !important;
  font-size: 11px !important;
  line-height: 1.6;
}


</style>
</head>
<body>
<div class="wrap" id="appWrap">

  <header>
    <div class="eyebrow-row">
      <div class="eyebrow-left">
        <span class="dot"></span>
        <span class="station-id">EARTH STATION &middot; DSNG SUPPORT CONSOLE</span>
      </div>
      <div class="header-right">
        <span class="version-tag" data-i18n="versionTag"></span>
        <div class="lang-toggle">
          <button id="langArBtn" class="active">AR</button>
          <button id="langEnBtn">EN</button>
        </div>
      </div>
    </div>
    <h1 data-i18n="title"></h1>
    <p class="sub" data-i18n="subtitle"></p>

    <div class="info-bar">
      <div class="field">
        <label data-i18n="engNameLabel"></label>
        <input type="text" id="engName" data-i18n-ph="engNamePh">
      </div>
      <div class="field">
        <label data-i18n="stationLabel"></label>
        <input type="text" id="stationName" data-i18n-ph="stationPh">
      </div>
    </div>

    <details class="about">
      <summary data-i18n="aboutSummary"></summary>
      <div class="about-body">
        <h4 data-i18n="aboutGoalH"></h4>
        <p data-i18n="aboutGoalP"></p>
        <h4 data-i18n="aboutMethodH"></h4>
        <p data-i18n="aboutMethodP"></p>
        <h4 data-i18n="aboutAiH"></h4>
        <p data-i18n="aboutAiP"></p>
      </div>
    </details>
  </header>

  <div class="grid" id="homeGrid"></div>
  <p class="stats-line mono" id="statsLine"></p>

  <div class="panel" id="flowPanel">
    <div class="panel-top">
      <span class="cat-tag mono" id="catTag"></span>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn" id="backBtn" data-i18n="backBtn"></button>
        <button class="icon-btn" id="homeBtn" data-i18n="homeBtn"></button>
      </div>
    </div>
    <div class="trail" id="trail" style="display:none;"></div>
    <div id="stepArea"></div>
  </div>

  <div class="ai-section">
    <button class="ai-toggle" id="aiToggle" data-i18n="aiToggle"></button>
    <div class="ai-box" id="aiBox">
      <textarea id="aiInput" data-i18n-ph="aiInputPh"></textarea>
      <br>
      <button class="ai-submit" id="aiSubmit" data-i18n="aiSubmit"></button>
      <div class="ai-answer" id="aiAnswer">
        <div class="label" data-i18n="aiAnswerLabel"></div>
        <div class="content" id="aiContent"></div>
      </div>
      <p class="ai-note" data-i18n="aiNote"></p>
    </div>
  </div>

  <div class="section-block" id="kbSection">
    <div class="section-head">
      <h2 data-i18n="kbHeader"></h2>
      <p class="section-sub" id="kbSub"></p>
    </div>
    <div class="form-panel">
      <div class="info-bar" style="margin-top:0;">
        <div class="field">
          <label data-i18n="kbTitleLabel"></label>
          <input id="kbTitle" type="text" data-i18n-ph="kbTitlePh">
        </div>
        <div class="field">
          <label data-i18n="kbCatLabel"></label>
          <select id="kbCategory"></select>
        </div>
      </div>
      <div class="field" style="margin-top:10px;">
        <label data-i18n="kbCausesLabel"></label>
        <textarea id="kbCauses" data-i18n-ph="kbCausesPh"></textarea>
      </div>
      <div class="field" style="margin-top:10px;">
        <label data-i18n="kbFixLabel"></label>
        <textarea id="kbFix" data-i18n-ph="kbFixPh"></textarea>
      </div>
      <div class="field" style="margin-top:10px;">
        <label data-i18n="kbNotesLabel"></label>
        <textarea id="kbNotes" style="min-height:60px;" data-i18n-ph="kbNotesPh"></textarea>
      </div>
      <button class="btn primary" id="kbSaveBtn" style="margin-top:14px;" data-i18n="kbSaveBtn"></button>
      <span class="status-msg" id="kbStatus"></span>
    </div>
    <div class="list-head">
      <span class="count-tag mono" id="kbCount"></span>
      <button class="icon-btn" id="kbExportAllBtn" data-i18n="kbExportAllBtn"></button>
    </div>
    <div id="kbList"></div>
  </div>

  <div class="section-block" id="expertSection">
    <div class="section-head">
      <h2 data-i18n="expHeader"></h2>
      <p class="section-sub" id="expSub"></p>
    </div>
    <div class="privacy-note" id="expPrivacyNote"></div>
    <div class="form-panel">
      <div class="info-bar" style="margin-top:0;">
        <div class="field">
          <label data-i18n="expNameLabel"></label>
          <input id="expName" type="text" data-i18n-ph="expNamePh">
        </div>
        <div class="field">
          <label data-i18n="expSpecLabel"></label>
          <input id="expSpec" type="text" data-i18n-ph="expSpecPh">
        </div>
      </div>
      <div class="info-bar" style="margin-top:10px;">
        <div class="field">
          <label data-i18n="expEmailLabel"></label>
          <input id="expEmail" type="text" data-i18n-ph="expEmailPh">
        </div>
        <div class="field">
          <label data-i18n="expExtLabel"></label>
          <input id="expExt" type="text" data-i18n-ph="expExtPh">
        </div>
      </div>
      <div class="field" style="margin-top:10px;">
        <label data-i18n="expNotesLabel"></label>
        <textarea id="expNotes" style="min-height:55px;" data-i18n-ph="expNotesPh"></textarea>
      </div>
      <button class="btn primary" id="expSaveBtn" style="margin-top:14px;" data-i18n="expSaveBtn"></button>
      <span class="status-msg" id="expStatus"></span>
    </div>
    <div class="list-head">
      <span class="count-tag mono" id="expCount"></span>
    </div>
    <div id="expList"></div>
  </div>

  <footer id="footerText"></footer>
</div>

<script>

let LANG = 'ar';

function T(key){ return (STR[LANG] && STR[LANG][key]) || key; }
function DATA(){ return APP_DATA[LANG]; }
function CATS(){ return DATA().categories; }
function NODES(){ return DATA().nodes; }
function CAT(id){ return CATS().find(c=>c.id===id); }
function NODE(id){ return NODES()[id]; }

const icons = {
  nosignal: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 0 1 7-4.6"/><path d="M5 13a9 9 0 0 1 3.5-4.2"/><path d="M12.5 3.5A9 9 0 0 1 19 6"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg>`,

};

/* ---------------- STATE ---------------- */
let currentCat = null;
let path = [];
let trailAnswers = [];

/* ---------------- I18N APPLY ---------------- */
function applyStaticI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = T(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    el.placeholder = T(el.getAttribute('data-i18n-ph'));
  });
  document.getElementById('langArBtn').classList.toggle('active', LANG==='ar');
  document.getElementById('langEnBtn').classList.toggle('active', LANG==='en');
  document.getElementById('kbSub').innerHTML = T('kbSub');
  document.getElementById('expSub').textContent = T('expSub');
  document.getElementById('expPrivacyNote').textContent = T('expPrivacyNote');
  document.getElementById('footerText').innerHTML = T('footerText');
}

function setLang(lang){
  LANG = lang;
  const html = document.getElementById('htmlRoot');
  html.lang = lang;
  html.dir = lang==='ar' ? 'rtl' : 'ltr';
  applyStaticI18n();
  renderHomeGrid();
  renderStats();
  populateKBCategorySelect();
  if(currentCat){
    document.getElementById('catTag').textContent = CAT(currentCat).title.toUpperCase();
    renderAll();
  }
  renderKBList();
  renderExpertList();
}
document.getElementById('langArBtn').onclick = ()=> setLang('ar');
document.getElementById('langEnBtn').onclick = ()=> setLang('en');

/* ---------------- HOME GRID ---------------- */
function renderHomeGrid(){
  const homeGrid = document.getElementById('homeGrid');
  homeGrid.innerHTML = '';
  CATS().forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'card-btn';
    btn.innerHTML = `${icons[c.icon]}<span class="ct">${c.title}</span><span class="cd">${c.desc}</span>`;
    btn.onclick = ()=> startCategory(c.id);
    homeGrid.appendChild(btn);
  });
}

function renderStats(){
  const totalScenarios = Object.values(NODES()).filter(n=>n.r).length;
  document.getElementById('statsLine').textContent =
    T('statsLine').replace('{n}', CATS().length).replace('{m}', totalScenarios);
}

function startCategory(id){
  currentCat = id;
  path = [CAT(id).root];
  trailAnswers = [];
  document.getElementById('catTag').textContent = CAT(id).title.toUpperCase();
  document.getElementById('flowPanel').classList.add('active');
  document.getElementById('homeGrid').style.display = 'none';
  document.getElementById('statsLine').style.display = 'none';
  renderAll();
  document.getElementById('flowPanel').scrollIntoView({behavior:'smooth', block:'start'});
}

function goHome(){
  document.getElementById('flowPanel').classList.remove('active');
  document.getElementById('homeGrid').style.display = 'grid';
  document.getElementById('statsLine').style.display = 'block';
}

function renderAll(){
  renderTrail();
  renderNode();
  document.getElementById('backBtn').disabled = trailAnswers.length===0;
}

function renderTrail(){
  const trail = document.getElementById('trail');
  if(trailAnswers.length===0){ trail.style.display='none'; trail.innerHTML=''; return; }
  trail.style.display='flex';
  trail.innerHTML = trailAnswers.map(t=>`<div class="trail-item">${t.q}<br><b>&rarr; ${t.a}</b></div>`).join('');
}

function renderNode(){
  const nodeId = path[path.length-1];
  const node = NODE(nodeId);
  const stepArea = document.getElementById('stepArea');

  if(node.r){
    stepArea.innerHTML = `
      <div class="result sev-${node.sev}">
        <div class="result-head">
          <span class="sev-tag mono">${T('sev_'+node.sev)}</span>
          <span class="result-title">${node.title}</span>
        </div>
        <div class="result-body">
          <div class="label">${T('recommendedAction')}</div>
          <ul>${node.steps.map(s=>`<li>${s}</li>`).join('')}</ul>
        </div>
      </div>
      <div class="result-actions">
        <button class="btn primary" id="printBtn">${T('printBtn')}</button>
        <button class="btn" id="copyBtn">${T('copyBtn')}</button>
        <span class="copy-flash" id="copyFlash">${T('copiedFlash')}</span>
        <button class="btn" id="restartBtn">${T('restartBtn')}</button>
      </div>
    `;
    document.getElementById('printBtn').onclick = printReport;
    document.getElementById('copyBtn').onclick = copyReport;
    document.getElementById('restartBtn').onclick = ()=>startCategory(currentCat);
  } else {
    stepArea.innerHTML = `
      <p class="q-text">${node.q}</p>
      <div class="opts">${node.o.map((opt,idx)=>`<button class="opt-btn" data-idx="${idx}">${opt.l}</button>`).join('')}</div>
    `;
    stepArea.querySelectorAll('.opt-btn').forEach((b,idx)=>{
      b.onclick = ()=>{
        const opt = node.o[idx];
        trailAnswers.push({q: node.q, a: opt.l});
        path.push(opt.n);
        renderAll();
      };
    });
  }
}

document.getElementById('backBtn').onclick = ()=>{
  if(trailAnswers.length===0) return;
  trailAnswers.pop();
  path.pop();
  renderAll();
};
document.getElementById('homeBtn').onclick = goHome;

/* ---------------- REPORT ---------------- */
function buildReport(){
  const nodeId = path[path.length-1];
  const node = NODE(nodeId);
  const eng = document.getElementById('engName').value.trim() || T('unspecified');
  const station = document.getElementById('stationName').value.trim() || T('unspecified');
  const now = new Date();
  const locale = LANG==='ar' ? 'ar-EG' : 'en-GB';
  const dateStr = now.toLocaleDateString(locale, {year:'numeric', month:'long', day:'numeric'});
  const timeStr = now.toLocaleTimeString(locale, {hour:'2-digit', minute:'2-digit'});
  return {eng, station, dateStr, timeStr, catTitle: CAT(currentCat).title, node, steps: trailAnswers};
}

function reportAsText(r){
  let lines = [];
  lines.push(T('reportTitle'));
  lines.push('----------------------------------------');
  lines.push(`${T('reportEngineer')}: ${r.eng}`);
  lines.push(`${T('reportStation')}: ${r.station}`);
  lines.push(`${T('reportDate')}: ${r.dateStr}  ${T('reportTime')}: ${r.timeStr}`);
  lines.push(`${T('reportCategory')}: ${r.catTitle}`);
  lines.push('');
  lines.push(T('reportPath') + ':');
  r.steps.forEach((s,i)=> lines.push(`  ${i+1}. ${s.q} -> ${s.a}`));
  lines.push('');
  lines.push(`${T('reportDiagnosis')}: [${T('sev_'+r.node.sev)}] ${r.node.title}`);
  lines.push(T('recommendedAction') + ':');
  r.node.steps.forEach(s=> lines.push(`  - ${s}`));
  return lines.join('\n');
}

function copyReport(){
  const text = reportAsText(buildReport());
  const flash = document.getElementById('copyFlash');
  const show = ()=>{ flash.style.display='inline'; setTimeout(()=>flash.style.display='none', 1800); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(show).catch(()=>fallbackCopy(text, show));
  } else { fallbackCopy(text, show); }
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){}
  document.body.removeChild(ta);
}

function printReport(){
  const r = buildReport();
  const area = document.getElementById('printArea');
  area.innerHTML = `
    <div class="pr-h">${T('reportTitle')}</div>
    <div class="pr-sub">${T('reportGenerated')}</div>
    <div class="pr-meta">
      <div><span>${T('reportEngineer')}</span>${r.eng}</div>
      <div><span>${T('reportStation')}</span>${r.station}</div>
      <div><span>${T('reportDate')}</span>${r.dateStr}</div>
      <div><span>${T('reportTime')}</span>${r.timeStr}</div>
      <div><span>${T('reportCategory')}</span>${r.catTitle}</div>
    </div>
    <div class="pr-section-title">${T('reportPath')}</div>
    ${r.steps.map((s,i)=>`<div class="pr-step">${i+1}. ${s.q}<br><b>&rarr; ${s.a}</b></div>`).join('')}
    <div class="pr-section-title">${T('reportDiagnosis')}</div>
    <div class="pr-diag">
      <h3>[${T('sev_'+r.node.sev)}] ${r.node.title}</h3>
      ${r.node.steps.map(s=>`<div class="pr-step">- ${s}</div>`).join('')}
    </div>
  `;
  window.print();
}

/* ---------------- KNOWLEDGE BANK ---------------- */
const KB_API = '/api/knowledge';
let kbEntries = [];
let kbSessionOnly = false;

function kbCategoryLabel(id){
  const c = CAT(id);
  return c ? c.title : T('otherCategory');
}

function populateKBCategorySelect(){
  const sel = document.getElementById('kbCategory');
  const prev = sel.value;

  sel.innerHTML = CATS().map(c =>
    `<option value="${c.id}">${c.title}</option>`
  ).join('') + `<option value="other">${T('otherCategory')}</option>`;

  if(prev) sel.value = prev;
}

function normalizeKBEntry(entry){
  return {
    ...entry,
    date: entry.created_at || entry.date || new Date().toISOString()
  };
}

async function loadKnowledgeEntries(){
  try{
    const response = await fetch(KB_API, {
      method: 'GET',
      headers: {
        'Accept': 'application/json'
      }
    });

    if(!response.ok){
      throw new Error(`Knowledge API returned ${response.status}`);
    }

    const data = await response.json();
    kbSessionOnly = false;
    return Array.isArray(data) ? data.map(normalizeKBEntry) : [];
  }catch(error){
    console.error('Knowledge Bank load error:', error);
    kbSessionOnly = true;
    return [];
  }
}

function renderKBList(){
  const list = document.getElementById('kbList');
  const count = document.getElementById('kbCount');

  count.textContent = kbSessionOnly
    ? T('kbCountSessionOnly').replace('{n}', kbEntries.length)
    : T('kbCountShared').replace('{n}', kbEntries.length);

  if(kbEntries.length === 0){
    list.innerHTML = `<div class="empty-msg">${T('kbEmpty')}</div>`;
    return;
  }

  list.innerHTML = [...kbEntries].reverse().map(e=>`
    <div class="entry-card" data-id="${escapeHtml(e.id)}">
      <div class="entry-card-top">
        <span class="entry-title">${escapeHtml(e.title)}</span>
        <span class="entry-badge">${T('kbPendingBadge')}</span>
      </div>

      <div class="entry-cat-tag mono">
        ${escapeHtml(kbCategoryLabel(e.category))}
      </div>

      <div class="entry-field-label">${T('kbCausesLabel')}</div>
      <div class="entry-field-text">${escapeHtml(e.causes)}</div>

      <div class="entry-field-label">${T('kbFixLabel')}</div>
      <div class="entry-field-text">${escapeHtml(e.fix)}</div>

      ${e.notes
        ? `<div class="entry-field-label">${T('kbNotesLabel')}</div>
           <div class="entry-field-text">${escapeHtml(e.notes)}</div>`
        : ''}

      <div class="entry-meta">
        ${escapeHtml(e.author || T('unspecifiedEngineer'))}
        &middot;
        ${localeDate(e.date)}
      </div>

      <div class="entry-actions">
        <button class="btn" data-act="word">${T('downloadWord')}</button>
        <button class="btn" data-act="pdf">${T('printPdf')}</button>
        <button class="btn danger" data-act="del">${T('delete')}</button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.entry-card').forEach(card=>{
    const id = card.dataset.id;
    const entry = kbEntries.find(x => x.id === id);

    card.querySelector('[data-act="word"]').onclick =
      () => downloadEntryAsWord(entry, 'kb');

    card.querySelector('[data-act="pdf"]').onclick =
      () => printEntry(entry, 'kb');

    card.querySelector('[data-act="del"]').onclick = async ()=>{
      if(!confirm(T('confirmDelete'))) return;

      try{
        const response = await fetch(`${KB_API}/${encodeURIComponent(id)}`, {
          method: 'DELETE'
        });

        if(!response.ok){
          throw new Error(`Delete failed with ${response.status}`);
        }

        kbEntries = kbEntries.filter(x => x.id !== id);
        renderKBList();
      }catch(error){
        console.error('Knowledge Bank delete error:', error);
        alert(
          LANG === 'ar'
            ? 'تعذر حذف السجل من قاعدة المعرفة.'
            : 'The knowledge entry could not be deleted.'
        );
      }
    };
  });
}

document.getElementById('kbSaveBtn').onclick = async ()=>{
  const title = document.getElementById('kbTitle').value.trim();
  const category = document.getElementById('kbCategory').value;
  const causes = document.getElementById('kbCauses').value.trim();
  const fix = document.getElementById('kbFix').value.trim();
  const notes = document.getElementById('kbNotes').value.trim();
  const author =
    document.getElementById('engName').value.trim() ||
    T('unspecifiedEngineer');

  const status = document.getElementById('kbStatus');

  if(!title || !causes || !fix){
    status.textContent = T('kbValidationMsg');
    status.style.color = 'var(--red)';
    return;
  }

  const payload = {
    title,
    category,
    causes,
    fix,
    notes,
    author
  };

  const saveBtn = document.getElementById('kbSaveBtn');
  saveBtn.disabled = true;

  try{
    const response = await fetch(KB_API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.detail || `Save failed with ${response.status}`);
    }

    const entry = normalizeKBEntry(data);

    kbEntries.push(entry);
    kbSessionOnly = false;

    status.style.color = 'var(--cyan)';
    status.textContent = T('savedOk');

    document.getElementById('kbTitle').value = '';
    document.getElementById('kbCauses').value = '';
    document.getElementById('kbFix').value = '';
    document.getElementById('kbNotes').value = '';

    renderKBList();

  }catch(error){
    console.error('Knowledge Bank save error:', error);

    status.style.color = 'var(--red)';
    status.textContent =
      LANG === 'ar'
        ? 'تعذر حفظ السجل في قاعدة المعرفة.'
        : 'The knowledge entry could not be saved.';
  }finally{
    saveBtn.disabled = false;
    setTimeout(()=> status.textContent = '', 3000);
  }
};


/* ---- Word / PDF export (shared by KB + Expert Directory) ---- */
function wordDocHtml(bodyHtml, title, dir){
  return `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset="utf-8"><title>${escapeHtml(title)}</title>
<style>
  body{font-family:Arial, Tahoma, sans-serif; direction:${dir}; text-align:${dir==='rtl'?'right':'left'};}
  h1{font-size:20px;} h2{font-size:15px;color:#333;border-bottom:1px solid #ccc;padding-bottom:4px;}
  .meta{font-size:12px;color:#555;margin-bottom:14px;}
  .box{border:1px solid #999;padding:10px;margin-bottom:14px;}
  p{font-size:13px;line-height:1.7;white-space:pre-wrap;}
</style></head>
<body>${bodyHtml}</body></html>`;
}
function triggerDocDownload(html, filename){
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadEntryAsWord(e, kind){
  const dir = LANG==='ar' ? 'rtl' : 'ltr';
  let body;
  if(kind==='kb'){
    body = `
      <h1>${escapeHtml(e.title)}</h1>
      <div class="meta">${T('kbCatLabel')}: ${escapeHtml(kbCategoryLabel(e.category))} | ${T('reportEngineer')}: ${escapeHtml(e.author)} | ${localeDate(e.date)}</div>
      <h2>${T('kbCausesLabel')}</h2><div class="box"><p>${escapeHtml(e.causes)}</p></div>
      <h2>${T('kbFixLabel')}</h2><div class="box"><p>${escapeHtml(e.fix)}</p></div>
      ${e.notes ? `<h2>${T('kbNotesLabel')}</h2><div class="box"><p>${escapeHtml(e.notes)}</p></div>` : ''}
    `;
  } else {
    body = `
      <h1>${escapeHtml(e.name)}</h1>
      <div class="meta">${T('expSpecLabel')}: ${escapeHtml(e.specialization)}</div>
      <h2>${T('expEmailLabel')}</h2><div class="box"><p>${escapeHtml(e.email||'-')}</p></div>
      <h2>${T('expExtLabel')}</h2><div class="box"><p>${escapeHtml(e.extension||'-')}</p></div>
      ${e.notes ? `<h2>${T('expNotesLabel')}</h2><div class="box"><p>${escapeHtml(e.notes)}</p></div>` : ''}
    `;
  }
  triggerDocDownload(wordDocHtml(body, e.title||e.name, dir), `${(e.title||e.name).slice(0,40)}.doc`);
}
function exportAllKBAsWord(){
  if(kbEntries.length===0){ alert(T('kbNothingToExport')); return; }
  const dir = LANG==='ar' ? 'rtl' : 'ltr';
  const body = [`<h1>${T('kbHeader')}</h1><div class="meta">${T('reportGenerated')} — ${new Date().toLocaleDateString(LANG==='ar'?'ar-EG':'en-GB')}</div>`]
    .concat([...kbEntries].reverse().map(e=>`
        <h2>${escapeHtml(e.title)}</h2>
        <div class="meta">${T('kbCatLabel')}: ${escapeHtml(kbCategoryLabel(e.category))} | ${T('reportEngineer')}: ${escapeHtml(e.author)} | ${localeDate(e.date)}</div>
        <div class="box">
          <p><b>${T('kbCausesLabel')}:</b>\n${escapeHtml(e.causes)}</p>
          <p><b>${T('kbFixLabel')}:</b>\n${escapeHtml(e.fix)}</p>
          ${e.notes ? `<p><b>${T('kbNotesLabel')}:</b>\n${escapeHtml(e.notes)}</p>` : ''}
        </div>`)).join('');
  triggerDocDownload(wordDocHtml(body, T('kbHeader'), dir), `knowledge-base-export.doc`);
}

/* ---------------- EXPERT DIRECTORY ---------------- */
const EXP_KEY = 'expert_directory';
let expEntries = [];
let expSessionOnly = false;

function renderExpertList(){
  const list = document.getElementById('expList');
  const count = document.getElementById('expCount');
  count.textContent = expSessionOnly
    ? T('expCountSessionOnly').replace('{n}', expEntries.length)
    : T('expCountShared').replace('{n}', expEntries.length);

  if(expEntries.length===0){
    list.innerHTML = `<div class="empty-msg">${T('expEmpty')}</div>`;
    return;
  }
  list.innerHTML = [...expEntries].reverse().map(e=>`
    <div class="entry-card" data-id="${e.id}">
      <div class="entry-card-top">
        <span class="entry-title">${escapeHtml(e.name)}</span>
      </div>
      <div class="entry-cat-tag mono">${escapeHtml(e.specialization)}</div>
      ${e.email ? `<div class="entry-field-label">${T('expEmailLabel')}</div><div class="entry-field-text">${escapeHtml(e.email)}</div>` : ''}
      ${e.extension ? `<div class="entry-field-label">${T('expExtLabel')}</div><div class="entry-field-text">${escapeHtml(e.extension)}</div>` : ''}
      ${e.notes ? `<div class="entry-field-label">${T('expNotesLabel')}</div><div class="entry-field-text">${escapeHtml(e.notes)}</div>` : ''}
      <div class="entry-actions">
        <button class="btn" data-act="word">${T('downloadWord')}</button>
        <button class="btn" data-act="pdf">${T('printPdf')}</button>
        <button class="btn danger" data-act="del">${T('delete')}</button>
      </div>
    </div>`).join('');

  list.querySelectorAll('.entry-card').forEach(card=>{
    const id = card.dataset.id;
    const entry = expEntries.find(x=>x.id===id);
    card.querySelector('[data-act="word"]').onclick = ()=> downloadEntryAsWord(entry, 'expert');
    card.querySelector('[data-act="pdf"]').onclick = ()=> printEntry(entry, 'expert');
    card.querySelector('[data-act="del"]').onclick = async ()=>{
      if(!confirm(T('confirmDelete'))) return;
      expEntries = expEntries.filter(x=>x.id!==id);
      await persistShared(EXP_KEY, expEntries);
      renderExpertList();
    };
  });
}

document.getElementById('expSaveBtn').onclick = async ()=>{
  const name = document.getElementById('expName').value.trim();
  const specialization = document.getElementById('expSpec').value.trim();
  const email = document.getElementById('expEmail').value.trim();
  const extension = document.getElementById('expExt').value.trim();
  const notes = document.getElementById('expNotes').value.trim();
  const status = document.getElementById('expStatus');

  if(!name || !specialization){
    status.textContent = T('expValidationMsg');
    status.style.color = 'var(--red)';
    return;
  }

    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    name, specialization, email, extension, notes,
    date: new Date().toISOString()
  };

  const ok = await persistShared(EXP_KEY, expEntries);
  status.style.color = 'var(--cyan)';
  status.textContent = ok ? T('savedOk') : T('savedSessionOnly');
  setTimeout(()=> status.textContent='', 3000);
  document.getElementById('expName').value='';
  document.getElementById('expSpec').value='';
  document.getElementById('expEmail').value='';
  document.getElementById('expExt').value='';
  document.getElementById('expNotes').value='';
  renderExpertList();
};
